services:
  inkwall:
    build: .
    container_name: inkwall
    init: true
    ports:
      - "8787:8787"
    environment:
      INKWALL_CONFIG_FILE: /config/settings.env
      INKWALL_OUTPUT_DIR:  /output
      INKWALL_LOGS_DIR:    /logs
    volumes:
      - ./config:/config
      - ./data/output:/output
      - ./logs:/logs
    restart: unless-stopped
