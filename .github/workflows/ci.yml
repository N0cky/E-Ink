name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt

      - name: Byte-compile
        run: |
          python -m py_compile app/config.py app/http_client.py app/idle_news_rendering.py app/image_rendering.py app/logger.py app/module_base.py app/module_registry.py app/module_services.py app/plex.py app/server.py wsgi.py modules/dwd_weather/__init__.py modules/dwd_weather/dwd.py modules/dwd_weather/dwd_pollen.py modules/dwd_weather/dwd_uv.py modules/dwd_weather/renderer.py modules/gallery/__init__.py modules/gallery/data_source.py modules/gallery/renderer.py modules/plex/__init__.py modules/tagesschau/__init__.py modules/tagesschau/data_source.py modules/tagesschau/renderer.py tests/test_module_registry.py tests/test_settings_validation.py tests/test_gallery_data_source.py

      - name: Run tests
        run: |
          python -m unittest tests.test_module_registry tests.test_settings_validation tests.test_gallery_data_source

      - name: Template smoke test
        run: |
          python -c "from app.server import app; [app.jinja_env.get_template(name) for name in ['base.html','index.html','settings.html','logs.html']]; print('TEMPLATES_OK')"
